<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ロードマップ ダッシュボード ｜ BitStar</title>
<style>
:root{
  --bg:#eef3fa; --bg2:#ffffff; --panel:#ffffff; --panel2:#f3f7fd;
  --line:#dde6f2; --line2:#c6d5e8;
  --ink:#13243d; --ink2:#52617c; --ink3:#92a0b8;
  --amber:#2563eb; --amber-d:#1b4fc4;        /* accent (blue) */
  --teal:#0ea5e9; --teal-d:#0284c7;          /* data / 実績 (sky blue) */
  --slate:#9aa9c2;
  --red:#e23744; --red-bg:rgba(226,55,68,.10);
  --green:#15a05a;
  --mono:'SFMono-Regular',ui-monospace,'Roboto Mono','DejaVu Sans Mono',monospace;
  --sans:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(37,99,235,.08), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,.07), transparent 60%),
    var(--bg);
  color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:repeating-linear-gradient(0deg,#1b3a6b 0,#1b3a6b 1px,transparent 1px,transparent 3px);}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 22px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:26px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand h1{font-size:20px;margin:0;letter-spacing:.02em;font-weight:800}
.brand .sub{color:var(--ink2);font-size:12px;margin-top:4px;letter-spacing:.08em;text-transform:uppercase}
.brand .accent{color:var(--amber)}
.legend{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.legend .a{border-color:var(--teal)} .legend .t{border-color:var(--slate);border-top-style:dashed}
.legend .b{width:10px;height:10px;border:0;background:var(--red);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:6px}

nav.tabs{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap}
nav.tabs button{background:var(--panel);color:var(--ink2);border:1px solid var(--line);
  padding:9px 16px;border-radius:9px;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600;
  transition:.15s}
nav.tabs button:hover{border-color:var(--line2);color:var(--ink)}
nav.tabs button.on{background:linear-gradient(180deg,#eaf1ff,#dfe9ff);color:var(--amber);
  border-color:var(--amber-d);box-shadow:0 0 0 1px rgba(37,99,235,.18) inset}

.panel{background:#ffffff;border:1px solid var(--line);
  border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
.panel h2{margin:0 0 4px;font-size:15px;letter-spacing:.02em}
.panel .desc{color:var(--ink2);font-size:12.5px;margin-bottom:16px}

.ctrls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.ctrls label{font-size:12px;color:var(--ink2)}
select,input[type=text]{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px;font-family:var(--sans);font-size:13px}
select:focus,input:focus{outline:none;border-color:var(--amber-d)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.kpi .k{font-size:11px;color:var(--ink2);letter-spacing:.04em}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.kpi .d{font-size:11px;margin-top:3px;font-family:var(--mono)}
.up{color:var(--green)} .down{color:var(--red)} .muted{color:var(--ink3)}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:0}
.fstage{position:relative;padding:0 4px}
.frow{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center;padding:7px 0}
.fname{font-size:13px;font-weight:600}
.fbar{position:relative;height:34px;background:var(--panel2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.fbar .tfill{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(154,169,194,.35),rgba(154,169,194,.35) 6px,rgba(154,169,194,.18) 6px,rgba(154,169,194,.18) 12px);border-right:2px dashed var(--slate)}
.fbar .afill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal-d),var(--teal));border-radius:0 6px 6px 0}
.fbar .lbl{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;color:var(--ink);background:rgba(255,255,255,.78);padding:1px 6px;border-radius:5px;z-index:2}
.fmeta{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
.conv{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center;margin:-2px 0}
.conv .arrow{grid-column:2;display:flex;align-items:center;gap:10px;padding-left:4px;font-size:11.5px;color:var(--ink2)}
.conv .pill{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);background:var(--panel2)}
.conv.bottleneck .arrow{color:var(--red)}
.conv.bottleneck .pill{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btag{display:inline-block;background:var(--red);color:#1a0307;font-weight:800;font-size:10px;padding:2px 7px;border-radius:5px;letter-spacing:.06em}

.diag{background:var(--red-bg);border:1px solid rgba(255,93,108,.35);border-radius:11px;padding:14px 16px;margin-top:4px}
.diag h3{margin:0 0 8px;font-size:13px;color:var(--red);letter-spacing:.03em}
.diag ul{margin:0;padding-left:18px} .diag li{margin:4px 0;font-size:12.5px;color:var(--ink)}
.diag .mono{font-family:var(--mono)}

/* Trends grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 12px 6px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--amber-d);transform:translateY(-1px)}
.card .ct{font-size:12.5px;font-weight:600;margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.card .ctag{font-size:10px;color:var(--ink3);font-family:var(--mono);white-space:nowrap}
.card .cv{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-bottom:4px}
svg.chart{display:block;width:100%;height:auto}
.dot{fill:var(--teal)}
.subhead{grid-column:1/-1;margin:14px 0 2px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,42,82,.40);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:900px;width:100%;padding:22px}
.modal .box h3{margin:0 0 2px;font-size:16px}
.modal .box .x{float:right;cursor:pointer;color:var(--ink2);font-size:22px;line-height:1;border:0;background:none}

/* edit table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
th{background:var(--panel2);position:sticky;top:0;z-index:3;font-weight:600;color:var(--ink2)}
th.mh{color:var(--amber)}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--panel2);z-index:2;min-width:200px;font-weight:600}
th.name{z-index:4}
td.ro{color:var(--ink3);font-family:var(--mono);background:#f6f9fd}
td.ed{background:rgba(14,165,233,.06)}
td input{width:84px;background:#ffffff;border:1px solid var(--line2);border-radius:6px;color:var(--ink);
  font-family:var(--mono);font-size:12px;padding:4px 6px;text-align:right}
td input.tgt{border-color:var(--line2)}
td input:focus{outline:none;border-color:var(--amber);background:#eef4ff}
td .pair{display:flex;flex-direction:column;gap:3px}
td .tag{font-size:9px;color:var(--ink3);text-align:left}
.btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:8px 16px;border-radius:9px;
  cursor:pointer;font-family:var(--sans);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--amber-d)}
.btn.primary{background:linear-gradient(180deg,var(--amber),var(--amber-d));color:#ffffff;border:0}
.btn.danger{color:var(--red);border-color:rgba(255,93,108,.4)}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px}
.savestat{font-size:11.5px;color:var(--teal);margin-left:6px}
.hint{display:inline-block;font-size:11px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);
  padding:3px 9px;border-radius:20px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>ロードマップ <span class="accent">ダッシュボード</span></h1>
      <div class="sub">BitStar Next / Boost / Live ・ 2025–2026</div>
    </div>
    <div class="legend">
      <span><i class="a"></i>実績</span>
      <span><i class="t"></i>目標</span>
      <span><span class="b"></span>ボトルネック</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-v="funnel" class="on">採用ファネル分析</button>
    <button data-v="trends">数値の推移</button>
    <button data-v="edit">データ編集（2026年6月〜）</button>
  </nav>

  <main id="main"></main>
</div>

<div class="modal" id="modal"><div class="box">
  <button class="x" onclick="closeModal()">&times;</button>

  <div class="cv" id="msub" style="color:var(--ink2);font-size:12px;margin-bottom:10px"></div>
  <div id="mchart"></div>
</div></div>

try{ store = JSON.parse(localStorage.getItem('roadmap_edits_v1')||'{}'); }catch(e){ store={}; }
function persist(){ try{ localStorage.setItem('roadmap_edits_v1', JSON.stringify(store)); }catch(e){} }
function key(row,idx,which){ return row+'|'+idx+'|'+which; }
function getVal(m,idx,which){ // which: 0=target,1=actual
  const k=key(m.row,idx,which);
  if(idx>=EDIT_FROM && k in store) return store[k];
  return m.values[idx][which];
}
function setVal(row,idx,which,v){
  const k=key(row,idx,which);
  if(v===''||v===null||v===undefined){ delete store[k]; } else { store[k]=Number(v); }
  persist();
}
function actual(row,idx){ return getVal(byRow[row],idx,1); }
function target(row,idx){ return getVal(byRow[row],idx,0); }

/* ---------- formatting ---------- */
function fmt(type,v,compact){
  if(v===null||v===undefined||isNaN(v)) return '–';
  if(type==='percent') return (v*100).toFixed(1)+'%';
  if(type==='yen'){
    if(compact){ const a=Math.abs(v);
      if(a>=1e8) return (v/1e8).toFixed(2)+'億'; if(a>=1e4) return Math.round(v/1e4)+'万'; return Math.round(v).toLocaleString();}
    return '¥'+Math.round(v).toLocaleString();
  }
  // count
  return (Math.abs(v%1)>1e-6? v.toFixed(1): Math.round(v).toLocaleString());
}

/* ---------- SVG line chart (target dashed + actual solid) ---------- */
function lineChart(metric, w, h){
  const pad={l:6,r:6,t:8,b:14};
  const W=w,H=h;
  const tgt=MONTHS.map((_,i)=>getVal(metric,i,0));
  const act=MONTHS.map((_,i)=>getVal(metric,i,1));
  const all=tgt.concat(act).filter(v=>v!==null&&v!==undefined&&!isNaN(v));
  if(!all.length) return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"></svg>';
  let mn=Math.min(...all,0), mx=Math.max(...all);
  if(mx===mn) mx=mn+1;
  const n=MONTHS.length;
  const X=i=> pad.l + (W-pad.l-pad.r)*(i/(n-1));
  const Y=v=> pad.t + (H-pad.t-pad.b)*(1-(v-mn)/(mx-mn));
  function path(arr){
    let d='',pen=false;
    arr.forEach((v,i)=>{ if(v===null||v===undefined||isNaN(v)){pen=false;return;}
      d+= (pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; pen=true; });
    return d.trim();
  }
  // divider between 2025 and 2026
  const divX=X(11.5);
  let dots='';
  act.forEach((v,i)=>{ if(v===null||v===undefined||isNaN(v))return;
    dots+='<circle class="dot" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="1.7"/>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    +'<line x1="'+divX+'" y1="'+pad.t+'" x2="'+divX+'" y2="'+(H-pad.b)+'" stroke="#d7e0ee" stroke-width="1" stroke-dasharray="2 3"/>'
    +'<path d="'+path(tgt)+'" fill="none" stroke="#94a3bc" stroke-width="1.4" stroke-dasharray="4 3" opacity=".9"/>'
    +'<path d="'+path(act)+'" fill="none" stroke="#0ea5e9" stroke-width="2"/>'
    +dots
    +'<text x="'+pad.l+'" y="'+(H-3)+'" fill="#92a0b8" font-size="8" font-family="var(--mono)">25</text>'
    +'<text x="'+(W-pad.r-12)+'" y="'+(H-3)+'" fill="#92a0b8" font-size="8" font-family="var(--mono)">26</text>'
    +'</svg>';
}

/* ============ FUNNEL ============ */
const FUNNEL=[ // row, label
  [12,'応募数'],[13,'名前送付数'],[15,'ADアポ数'],[17,'AD参加数'],
  [20,'面談アポ数'],[22,'面談参加数'],[32,'決済数'],[33,'着金数'] ];

function latestActualIdx(){
  for(let i=MONTHS.length-1;i>=0;i--){ if(actual(12,i)!==null) return i; }
  return MONTHS.length-1;
}
let funnelIdx = latestActualIdx();

function renderFunnel(){
  const opts=MONTHS.map((m,i)=>'<option value="'+i+'"'+(i===funnelIdx?' selected':'')+'>'+m.replace('-','年')+'月</option>').join('');
  let html='<div class="panel">'
    +'<div class="ctrls"><label>対象月</label><select id="fmonth">'+opts+'</select>'
    +'<span class="hint">バーは実績、点線枠は目標。各段階の歩留まりが目標を最も下回る箇所をボトルネックとして検出します。</span></div>';

  // KPI row
  const ap=actual(12,funnelIdx), tk=actual(33,funnelIdx);
  const sales=actual(70,funnelIdx);            // 着金ベース売上
  const cpa=actual(11,funnelIdx);
  const a2k = (ap&&tk)? tk/ap : null;
  const tgtA2k = (target(12,funnelIdx)&&target(33,funnelIdx))? target(33,funnelIdx)/target(12,funnelIdx):null;
  html+='<div class="kpis">'
    + kcard('応募数',fmt('count',ap),deltaTxt('count',ap,target(12,funnelIdx)))
    + kcard('着金数',fmt('count',tk),deltaTxt('count',tk,target(33,funnelIdx)))
    + kcard('応募→着金率',fmt('percent',a2k), a2k!=null&&tgtA2k!=null? cmpPct(a2k,tgtA2k):'<span class="muted">目標 '+fmt('percent',tgtA2k)+'</span>')
    + kcard('CPA',fmt('yen',cpa),deltaTxt('yen',cpa,target(11,funnelIdx),true))
    + kcard('着金ベース売上',fmt('yen',sales,true),deltaTxt('yen',sales,target(70,funnelIdx),false,true))
    +'</div>';

  // build funnel
  const maxBase = Math.max(actual(12,funnelIdx)||0, target(12,funnelIdx)||0, 1);
  // compute conversions + find bottleneck
  const convs=[];
  for(let s=0;s<FUNNEL.length-1;s++){
    const a0=actual(FUNNEL[s][0],funnelIdx), a1=actual(FUNNEL[s+1][0],funnelIdx);
    const t0=target(FUNNEL[s][0],funnelIdx), t1=target(FUNNEL[s+1][0],funnelIdx);
    const ac=(a0&&a1)?a1/a0:null, tc=(t0&&t1)?t1/t0:null;
    convs.push({s,ac,tc,gap:(ac!=null&&tc!=null)? (tc-ac):null});
  }
  // bottleneck = largest positive gap (actual below target); fallback lowest ac
  let bnz=-1,best=-Infinity;
  convs.forEach(c=>{ if(c.gap!=null&&c.gap>best){best=c.gap;bnz=c.s;} });
  if(best<=0.0001){ // no shortfall vs target -> use lowest actual conversion
    let lo=Infinity; convs.forEach(c=>{ if(c.ac!=null&&c.ac<lo){lo=c.ac;bnz=c.s;} });
  }

  html+='<div class="funnel">';
  for(let s=0;s<FUNNEL.length;s++){
    const a=actual(FUNNEL[s][0],funnelIdx), t=target(FUNNEL[s][0],funnelIdx);
    const aw=Math.max(0,(a||0)/maxBase*100), tw=Math.max(0,(t||0)/maxBase*100);
    html+='<div class="frow"><div class="fname">'+FUNNEL[s][1]+'</div>'
      +'<div class="fbar">'
        +'<div class="tfill" style="width:'+tw.toFixed(1)+'%"></div>'
        +'<div class="afill" style="width:'+aw.toFixed(1)+'%"></div>'
        +'<div class="lbl">'+fmt('count',a)+'</div>'
      +'</div>'
      +'<div class="fmeta">目標 '+fmt('count',t)+'</div></div>';
    if(s<FUNNEL.length-1){
      const c=convs[s], isB=(s===bnz);
      const acT=c.ac!=null?fmt('percent',c.ac):'–';
      const tcT=c.tc!=null?fmt('percent',c.tc):'–';
      html+='<div class="conv'+(isB?' bottleneck':'')+'"><div class="arrow">↓ 歩留まり '
        +'<span class="pill">実績 '+acT+'</span><span class="pill">目標 '+tcT+'</span>'
        +(isB?' <span class="btag">BOTTLENECK</span>':'')+'</div></div>';
    }
  }
  html+='</div>';

  // diagnosis
  html+=buildDiagnosis(bnz,convs);
  html+='</div>';
  main.innerHTML=html;
  document.getElementById('fmonth').addEventListener('change',e=>{funnelIdx=+e.target.value;renderFunnel();});
}
function kcard(k,v,d){ return '<div class="kpi"><div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+(d||'')+'</div></div>'; }
function cmpPct(a,t){ const ok=a>=t; return '<span class="'+(ok?'up':'down')+'">目標比 '+(a>=t?'+':'')+((a-t)*100).toFixed(1)+'pt</span>'; }
function deltaTxt(type,a,t,lowerBetter,compact){
  if(a==null||t==null||isNaN(a)||isNaN(t)) return t!=null?'<span class="muted">目標 '+fmt(type,t,compact)+'</span>':'';
  const diff=a-t; const good = lowerBetter? diff<=0 : diff>=0;
  return '<span class="'+(good?'up':'down')+'">目標比 '+(diff>=0?'+':'')+fmt(type,diff,compact)+'</span>';
}
function buildDiagnosis(bnz,convs){
  const idx=funnelIdx; let items=[];
  if(bnz>=0){
    const from=FUNNEL[bnz][1], to=FUNNEL[bnz+1][1], c=convs[bnz];
    let msg='<b>'+from+' → '+to+'</b> が最大のボトルネックです。';
    if(c.ac!=null&&c.tc!=null) msg+=' 歩留まり実績 <span class="mono">'+fmt('percent',c.ac)+'</span>（目標 <span class="mono">'+fmt('percent',c.tc)+'</span>／<span class="down">'+((c.ac-c.tc)*100).toFixed(1)+'pt</span>）。';
    items.push(msg);
    // estimated recovered count if hitting target conv
    const a0=actual(FUNNEL[bnz][0],idx);
    if(a0!=null&&c.tc!=null&&c.ac!=null){
      const lost=Math.round(a0*(c.tc-c.ac));
      if(lost>0) items.push('この段階を目標歩留まりまで改善すると、当月 <span class="mono">+'+lost+'</span> 件の'+to+'を回収できる試算です。');
    }
  }
  // worst vs-target KPIs among key metrics this month
  const watch=[[14,'名前送付率'],[16,'ADアポ率'],[18,'AD参加率'],[21,'面談アポ率'],[24,'面談参加率'],[35,'着金率'],[40,'クーオフ率']];
  let worst=null;
  watch.forEach(([r,l])=>{ const a=actual(r,idx),t=target(r,idx); if(a==null||t==null)return;
    const lower = (l==='クーオフ率'); const gap = lower? (a-t) : (t-a);
    if(gap>0 && (!worst||gap/Math.abs(t)>worst.rel)) worst={l,a,t,rel:gap/Math.abs(t),lower}; });
  if(worst) items.push('率の指標では <b>'+worst.l+'</b> が目標から最も乖離（実績 <span class="mono">'+fmt('percent',worst.a)+'</span> vs 目標 <span class="mono">'+fmt('percent',worst.t)+'</span>）。');
  if(actual(12,idx)===null) items.unshift('この月の実績は未入力です。「データ編集」タブから入力すると診断が更新されます。');
  if(!items.length) items.push('主要段階はおおむね目標を達成しています。');
  return '<div class="diag"><h3>◆ ボトルネック診断（'+MONTHS[idx].replace('-','年')+'月）</h3><ul>'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul></div>';
}

/* ============ TRENDS ============ */
function renderTrends(){
  const subs=[...new Set(DATA.metrics.map(m=>m.subsection))];
  const opts='<option value="">すべて</option>'+subs.map(s=>'<option>'+s+'</option>').join('');
  let html='<div class="panel"><div class="ctrls">'
    +'<label>カテゴリ</label><select id="tsel">'+opts+'</select>'
    +'<input type="text" id="tsearch" placeholder="指標名で検索…">'
    +'<span class="hint">カードをクリックで拡大。実線＝実績、点線＝目標。中央の縦線が 2025／2026 の境界。</span>'
    +'</div><div class="grid" id="tgrid"></div></div>';
  main.innerHTML=html;
  const draw=()=>{
    const f=document.getElementById('tsel').value;
    const q=document.getElementById('tsearch').value.trim();
    const grid=document.getElementById('tgrid'); grid.innerHTML='';
    let cur=null;
    DATA.metrics.filter(m=>(!f||m.subsection===f)&&(!q||m.label.includes(q))).forEach(m=>{
      if(m.subsection!==cur){cur=m.subsection;const h=document.createElement('div');h.className='subhead';h.textContent=cur;grid.appendChild(h);}
      const li=latestActualIdx2(m); const lv = li>=0? getVal(m,li,1):null;
      const c=document.createElement('div');c.className='card';
      c.innerHTML='<div class="ct"><span>'+m.label+'</span><span class="ctag">'+typeLabel(m.type)+'</span></div>'
        +'<div class="cv">最新 '+(li>=0?MONTHS[li].slice(2).replace('-','/'):'-')+'：'+fmt(m.type,lv)+'</div>'
        +lineChart(m,300,82);
      c.onclick=()=>openChart(m);
      grid.appendChild(c);
    });
    if(!grid.children.length) grid.innerHTML='<div class="cv" style="color:var(--ink3)">該当する指標がありません。</div>';
  };
  document.getElementById('tsel').onchange=draw;
  document.getElementById('tsearch').oninput=draw;
  draw();
}
function typeLabel(t){return t==='percent'?'率':t==='yen'?'¥':'数';}
function latestActualIdx2(m){ for(let i=MONTHS.length-1;i>=0;i--){const v=getVal(m,i,1);if(v!==null&&v!==undefined)return i;} return -1; }

function openChart(m){
  document.getElementById('mtitle').textContent=m.label;
  document.getElementById('msub').textContent=m.subsection+' ・ '+typeLabelFull(m.type);
  // big chart with month labels + value table-ish
  const box=document.getElementById('mchart');
  box.innerHTML='<div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px">'
    + bigChart(m) + '</div>'
    + miniTable(m);
  document.getElementById('modal').classList.add('open');
}
function typeLabelFull(t){return t==='percent'?'比率':t==='yen'?'金額（円）':'件数';}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function bigChart(m){
  const W=860,H=300,pad={l:54,r:14,t:14,b:34};
  const tgt=MONTHS.map((_,i)=>getVal(m,i,0)), act=MONTHS.map((_,i)=>getVal(m,i,1));
  const all=tgt.concat(act).filter(v=>v!=null&&!isNaN(v));
  if(!all.length)return '<div style="color:var(--ink3);padding:30px">データなし</div>';
  let mn=Math.min(...all,0),mx=Math.max(...all); if(mx===mn)mx=mn+1;
  const n=MONTHS.length;
  const X=i=>pad.l+(W-pad.l-pad.r)*(i/(n-1));
  const Y=v=>pad.t+(H-pad.t-pad.b)*(1-(v-mn)/(mx-mn));
  const path=arr=>{let d='',p=false;arr.forEach((v,i)=>{if(v==null||isNaN(v)){p=false;return;}d+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' ';p=true;});return d.trim();};
  let grid='',ticks=4;
  for(let g=0;g<=ticks;g++){const val=mn+(mx-mn)*g/ticks;const y=Y(val);
    grid+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#e3eaf4" stroke-width="1"/>'
      +'<text x="'+(pad.l-6)+'" y="'+(y+3)+'" text-anchor="end" fill="#92a0b8" font-size="9" font-family="var(--mono)">'+fmt(m.type,val,true)+'</text>';}
  let xl='';for(let i=0;i<n;i+=2){xl+='<text x="'+X(i)+'" y="'+(H-12)+'" text-anchor="middle" fill="#92a0b8" font-size="8.5" font-family="var(--mono)">'+MONTHS[i].slice(2).replace('-','/')+'</text>';}
  let dots='';act.forEach((v,i)=>{if(v==null||isNaN(v))return;dots+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="2.4" fill="#0ea5e9"/>';});
  const divX=X(11.5);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +grid
    +'<line x1="'+divX+'" y1="'+pad.t+'" x2="'+divX+'" y2="'+(H-pad.b)+'" stroke="#cdd9ea" stroke-dasharray="3 3"/>'
    +'<path d="'+path(tgt)+'" fill="none" stroke="#94a3bc" stroke-width="1.8" stroke-dasharray="5 4"/>'
    +'<path d="'+path(act)+'" fill="none" stroke="#0ea5e9" stroke-width="2.4"/>'
    +dots+xl+'</svg>';
}
function miniTable(m){
  let h='<div class="tablewrap" style="margin-top:12px;max-height:200px"><table><tr><th class="name">指標</th>';
  MONTHS.forEach(mo=>h+='<th'+(MONTHS.indexOf(mo)>=EDIT_FROM?' class="mh"':'')+'>'+mo.slice(2).replace('-','/')+'</th>');
  h+='</tr><tr><td class="name">目標</td>';
  MONTHS.forEach((mo,i)=>h+='<td class="ro">'+fmt(m.type,getVal(m,i,0))+'</td>');
  h+='</tr><tr><td class="name">実績</td>';
  MONTHS.forEach((mo,i)=>h+='<td class="ro" style="color:var(--teal)">'+fmt(m.type,getVal(m,i,1))+'</td>');
  h+='</tr></table></div>';
  return h;
}

/* ============ EDIT ============ */
function renderEdit(){
  const subs=[...new Set(DATA.metrics.map(m=>m.subsection))];
  const opts=subs.map((s,i)=>'<option'+(i===0?' selected':'')+'>'+s+'</option>').join('');
  const editMonths=MONTHS.slice(EDIT_FROM); // 2026-06 .. 2026-12
  let html='<div class="panel"><h2>データ編集 — 2026年6月以降</h2>'
    +'<div class="desc">対象月の <b style="color:var(--amber)">目標</b> と <b style="color:var(--teal)">実績</b> を直接入力できます。入力すると採用ファネルと推移グラフに即時反映され、ブラウザに自動保存されます（2026年5月以前は確定値のため編集不可）。</div>'
    +'<div class="ctrls"><label>カテゴリ</label><select id="esel">'+opts+'</select>'
    +'<span class="savestat" id="savestat"></span></div>'
    +'<div class="tablewrap"><table id="etable"></table></div>'
    +'<div class="btns">'
      +'<button class="btn primary" onclick="exportCSV()">CSVで書き出し</button>'
      +'<button class="btn" onclick="exportJSON()">編集内容をJSON保存</button>'
      +'<button class="btn danger" onclick="resetEdits()">編集をすべてリセット</button>'
    +'</div>'
    +'<div class="note">※ 編集はこのブラウザにのみ保存されます。元データは変更されません。共有・バックアップにはCSV/JSON書き出しをご利用ください。</div>'
    +'</div>';
  main.innerHTML=html;
  const sel=document.getElementById('esel');
  sel.onchange=()=>drawEditTable(sel.value,editMonths);
  drawEditTable(sel.value,editMonths);
}
function drawEditTable(sub,editMonths){
  const rows=DATA.metrics.filter(m=>m.subsection===sub);
  let h='<tr><th class="name">指標</th>';
  editMonths.forEach(mo=>h+='<th class="mh" colspan="2">'+mo.replace('-','年')+'月</th>');
  h+='</tr><tr><th class="name"></th>';
  editMonths.forEach(()=>h+='<th style="font-size:10px;color:var(--slate)">目標</th><th style="font-size:10px;color:var(--teal)">実績</th>');
  h+='</tr>';
  rows.forEach(m=>{
    h+='<tr><td class="name">'+m.label+'<div class="tag" style="font-size:9px;color:var(--ink3)">'+typeLabelFull(m.type)+'</div></td>';
    editMonths.forEach((mo,j)=>{
      const idx=EDIT_FROM+j;
      const tv=getVal(m,idx,0), av=getVal(m,idx,1);
      h+='<td class="ed"><input data-r="'+m.row+'" data-i="'+idx+'" data-w="0" value="'+(tv==null?'':round4(tv))+'" placeholder="目標"></td>';
      h+='<td class="ed"><input data-r="'+m.row+'" data-i="'+idx+'" data-w="1" value="'+(av==null?'':round4(av))+'" placeholder="実績"></td>';
    });
    h+='</tr>';
  });
  const t=document.getElementById('etable'); t.innerHTML=h;
  t.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      setVal(+inp.dataset.r,+inp.dataset.i,+inp.dataset.w,inp.value.trim());
      flashSaved();
    });
  });
}
function round4(v){ return Math.abs(v%1)>1e-9? Math.round(v*10000)/10000 : v; }
function flashSaved(){ const s=document.getElementById('savestat'); if(!s)return; s.textContent='✓ 保存しました'; clearTimeout(window._st); window._st=setTimeout(()=>s.textContent='',1500); }

function resetEdits(){
  if(!confirm('入力した編集内容をすべて削除して元データに戻します。よろしいですか？'))return;
  store={}; persist();
  funnelIdx=latestActualIdx(); renderEdit();
}
function exportJSON(){
  download('roadmap_edits.json', JSON.stringify(store,null,2),'application/json');
}
function exportCSV(){
  const head=['section','metric','type','field'].concat(MONTHS);
  const lines=[head.join(',')];
  DATA.metrics.forEach(m=>{
    ['目標','実績'].forEach((f,w)=>{
      const row=[csv(m.subsection),csv(m.label),m.type,f];
      MONTHS.forEach((mo,i)=>{ const v=getVal(m,i,w); row.push(v==null?'':v); });
      lines.push(row.join(','));
    });
  });
  download('roadmap_export.csv','\ufeff'+lines.join('\n'),'text/csv');
}
function csv(s){ s=String(s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function download(name,content,type){
  const b=new Blob([content],{type:type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
